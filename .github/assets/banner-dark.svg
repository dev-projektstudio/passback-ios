<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="PassbackKit: web checkout and StoreKit 2 purchases for iOS">
  <defs>
    <radialGradient id="glow" cx="0.12" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#f0603a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#f0603a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#08090a" stop-opacity="1"/>
      <stop offset="1" stop-color="#08090a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff1f" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="440" rx="24"/></clipPath>
    <clipPath id="disc"><circle cx="50" cy="50" r="46"/></clipPath>
    <clipPath id="bigdisc"><circle cx="1090" cy="250" r="230"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="440" fill="#08090a"/>
    <rect width="1280" height="440" fill="url(#grid)"/>
    <rect width="760" height="440" fill="url(#fade)"/>
    <rect width="1280" height="440" fill="url(#glow)"/>

    <!-- The baton, large and quiet, on the right. -->
    <g clip-path="url(#bigdisc)" opacity="0.9">
      <circle cx="1090" cy="250" r="230" fill="#0f1011"/>
      <circle cx="1090" cy="250" r="229.5" fill="none" stroke="#ffffff1f"/>
      <g fill="none" stroke-width="44" stroke-linecap="round">
        <path d="M968 362 L1068 262" stroke="#62666d" stroke-opacity="0.55"/>
        <path d="M1040 354 L1240 154" stroke="#f0603a"/>
      </g>
    </g>

    <!-- Wordmark. -->
    <g transform="translate(72 64) scale(0.48)">
      <g clip-path="url(#disc)">
        <circle cx="50" cy="50" r="46" fill="#f7f8f8"/>
        <g fill="none" stroke="#08090a" stroke-width="9" stroke-linecap="round">
          <path d="M18 66 L46 38"/>
          <path d="M40 60 L82 18"/>
        </g>
      </g>
    </g>
    <text x="130" y="97" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="-0.5" fill="#f7f8f8">Passback</text>
    <rect x="252" y="73" width="74" height="30" rx="15" fill="none" stroke="#ffffff1f" stroke-width="1.5"/>
    <text x="289" y="94" text-anchor="middle" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#8a8f98">iOS</text>

    <!-- Headline. -->
    <text font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="650" letter-spacing="-2" fill="#f7f8f8">
      <tspan x="72" y="206">Web checkout and</tspan>
      <tspan x="72" y="272">in-app purchases.</tspan>
    </text>
    <text x="72" y="320" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#8a8f98">One Swift package. One answer for who is subscribed.</text>

    <!-- Install line. -->
    <rect x="72" y="352" width="560" height="44" rx="10" fill="#0f1011" stroke="#ffffff1f"/>
    <text x="92" y="380" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#62666d">$</text>
    <text x="112" y="380" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, monospace" font-size="15" fill="#f7f8f8">github.com/dev-projektstudio/<tspan fill="#f0603a">passback-ios</tspan></text>
  </g>
</svg>
